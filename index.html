<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crashman – Tous mes liens</title>
<meta name="description" content="Streamer sans spécialité. Retrouve Crashman sur Twitch, Twitter et Discord.">
<meta property="og:title" content="Crashman – Tous mes liens">
<meta property="og:description" content="Streamer sans spécialité. Hésite pas à lâcher ton follow 🧡">
<meta property="og:type" content="website">
<meta name="theme-color" content="#14110E">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🟠</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14110E;
    --cream: #F5EBDD;
    --orange: #FF6A00;
    --orange-deep: #C94F00;
    --muted: #B9AC9A;
    --hex: polygon(16px 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 16px 100%, 0 50%);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body {
    background: var(--ink);
    color: var(--cream);
    font-family: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 17px;
    line-height: 1.5;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
    background-image:
      radial-gradient(circle at 50% -10%, rgba(255,106,0,.28), transparent 55%);
    background-repeat: no-repeat;
  }
  main {
    max-width: 440px;
    margin: 0 auto;
    padding: 48px 20px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Identity */
  .avatar {
    width: 120px;
    height: 138px;
    background: var(--orange);
    clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    display: grid;
    place-items: center;
    font-family: "Chakra Petch", system-ui, sans-serif;
    font-weight: 700;
    font-size: 64px;
    color: var(--ink);
    animation: drop .7s cubic-bezier(.2,.9,.3,1.2) both;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  @keyframes drop {
    from { transform: translateY(-24px) scale(.9); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }
  h1 {
    margin-top: 20px;
    font-family: "Chakra Petch", system-ui, sans-serif;
    font-weight: 700;
    font-size: 40px;
    letter-spacing: .02em;
    line-height: 1.1;
  }
  .tagline {
    margin-top: 6px;
    color: var(--muted);
    text-align: center;
  }

  /* Links */
  nav {
    width: 100%;
    margin-top: 36px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .link {
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 62px;
    padding: 0 28px;
    background: var(--cream);
    color: var(--ink);
    text-decoration: none;
    clip-path: var(--hex);
    font-family: "Chakra Petch", system-ui, sans-serif;
    font-weight: 600;
    font-size: 18px;
    transition: background-color .15s, color .15s, transform .15s;
  }
  .link svg { width: 24px; height: 24px; flex: none; fill: currentColor; }
  .link span { flex: 1; }
  .link small {
    font-family: "Barlow", system-ui, sans-serif;
    font-weight: 500;
    font-size: 14px;
    opacity: .7;
  }
  .link.primary { background: var(--orange); }
  .link:hover { background: var(--orange-deep); color: var(--cream); transform: translateY(-2px); }
  .link:focus-visible { background: var(--ink); color: var(--orange); outline: none; box-shadow: inset 0 0 0 3px var(--orange); }
  .link:active { transform: none; }

  /* Dons */
  .support {
    width: 100%;
    margin-top: 44px;
    text-align: center;
  }
  .support h2 {
    font-family: "Chakra Petch", system-ui, sans-serif;
    font-weight: 700;
    font-size: 24px;
  }
  .support p {
    margin: 6px 0 20px;
    color: var(--muted);
  }
  .link svg.stroke { fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .link.wave { background: #1DC8FF; }
  .link.wave:hover { background: #12A3D1; color: var(--ink); }
  .copy {
    width: 100%;
    min-height: 54px;
    margin-top: 14px;
    padding: 0 28px;
    border: 0;
    background: #2A241E;
    color: var(--cream);
    clip-path: var(--hex);
    font-family: "Chakra Petch", system-ui, sans-serif;
    font-weight: 600;
    font-size: 16px;
    cursor: pointer;
    transition: background-color .15s, color .15s;
  }
  .copy:hover { background: #3A322A; }
  .copy:focus-visible { outline: none; box-shadow: inset 0 0 0 3px var(--orange); color: var(--orange); }

  footer {
    margin-top: 40px;
    font-size: 14px;
    color: var(--muted);
    text-align: center;
  }

  @media (prefers-reduced-motion: reduce) {
    .avatar { animation: none; }
    .link { transition: none; }
    .link:hover { transform: none; }
  }
</style>
</head>

</html>
